# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: AthenaeInitiative/athenae-website
  branch: master
  base_url: https://sveltia-cms-auth.athenaeinitiative.workers.dev

media_folder: static/media
public_folder: /media

i18n:
  structure: single_file
  locales: [en, fr]
  default_locale: en
  initial_locales: all

collections:
  - name: site
    label: Website Content
    i18n: true
    files:
      - name: site
        label: General strings
        file: content/site.json
        format: json
        i18n: true
        fields:
          - name: site
            label: Site settings
            widget: object
            i18n: true
            fields:
              - { name: title, label: Site title, widget: string, i18n: true }
              - { name: description, label: Description, widget: text, i18n: true }
              - { name: email, label: Email, widget: string, i18n: duplicate }
          - name: nav
            label: Navigation
            widget: object
            i18n: true
            fields:
              - { name: about, label: About, widget: string, i18n: true }
              - { name: programs, label: Programs, widget: string, i18n: true }
              - { name: getInvolved, label: Get involved, widget: string, i18n: true }
              - { name: news, label: News, widget: string, i18n: true }
              - { name: contact, label: Contact, widget: string, i18n: true }
              - { name: donate, label: Donate, widget: string, i18n: true }
              - { name: language, label: Language toggle, widget: string, i18n: true }
          - name: home
            label: Home page
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
              - { name: headline, label: Headline, widget: string, i18n: true }
              - { name: subheadline, label: Subheadline, widget: text, i18n: true }
              - { name: primaryCta, label: Primary button, widget: string, i18n: true }
              - { name: secondaryCta, label: Secondary button, widget: string, i18n: true }
              - { name: scrollHint, label: Scroll hint, widget: string, i18n: true }
              - { name: upcomingLabel, label: Upcoming section label, widget: string, i18n: true }
              - { name: upcomingHeading, label: Upcoming section heading, widget: string, i18n: true }
              - { name: viewAllNews, label: View all news, widget: string, i18n: true }
              - { name: fieldNotesLabel, label: Field notes label, widget: string, i18n: true }
              - { name: fieldNotesHeading, label: Field notes heading, widget: string, i18n: true }
          - name: footer
            label: Footer
            widget: object
            i18n: true
            fields:
              - { name: organization, label: Organization, widget: string, i18n: true }
              - { name: participate, label: Participate, widget: string, i18n: true }
              - { name: legal, label: Legal, widget: string, i18n: true }
              - { name: tagline, label: Tagline, widget: string, i18n: true }
              - { name: rights, label: Copyright, widget: string, i18n: true }
              - { name: privacy, label: Privacy link, widget: string, i18n: true }
              - { name: terms, label: Terms link, widget: string, i18n: true }
              - { name: contact, label: Contact label, widget: string, i18n: true }
          - name: accessibility
            label: Accessibility labels
            widget: object
            i18n: true
            fields:
              - { name: skipToContent, label: Skip to content, widget: string, i18n: true }
              - { name: mainNavigation, label: Main navigation, widget: string, i18n: true }
              - { name: mobileNavigation, label: Mobile navigation, widget: string, i18n: true }
              - { name: switchLanguage, label: Switch language, widget: string, i18n: true }
              - { name: openMenu, label: Open menu, widget: string, i18n: true }
              - { name: home, label: Home link, widget: string, i18n: true }
              - { name: logoAlt, label: Logo description, widget: string, i18n: true }
              - { name: hero, label: Hero label, widget: string, i18n: true }
          - name: actions
            label: Actions and utilities
            widget: object
            i18n: true
            fields:
              - { name: readArticle, label: Read article, widget: string, i18n: true }
              - { name: eventDetails, label: Event details, widget: string, i18n: true }
              - { name: allNews, label: All news, widget: string, i18n: true }
              - { name: sendEmail, label: Send email, widget: string, i18n: true }
              - { name: contactUs, label: Contact us, widget: string, i18n: true }
              - { name: contentManagement, label: Content management, widget: string, i18n: true }
          - name: news
            label: News interface
            widget: object
            i18n: true
            fields:
              - { name: upcomingEvents, label: Upcoming events, widget: string, i18n: true }
              - { name: articles, label: Articles, widget: string, i18n: true }
              - { name: noUpcomingEvents, label: No upcoming events, widget: text, i18n: true }
              - { name: noArticles, label: No articles, widget: text, i18n: true }
              - { name: noArticlesForTag, label: No articles for tag, widget: text, i18n: true }
              - { name: pageNotFound, label: Page not found, widget: string, i18n: true }
  - name: pages
    label: Pages
    i18n:
      structure: multiple_files
      locales: [en, fr]
      default_locale: en
    files:
      - name: about
        label: About
        file: content/pages/about.{{locale}}.json
        format: json
        i18n: true
        fields: &page_fields
          - { name: eyebrow, label: Eyebrow, widget: string, i18n: true }
          - { name: title, label: Title, widget: string, i18n: true }
          - { name: intro, label: Intro, widget: text, i18n: true }
          - { name: body, label: Page content, widget: markdown, i18n: true }
      - name: programs
        label: Programs
        file: content/pages/programs.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
      - name: get-involved
        label: Get involved
        file: content/pages/get-involved.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
      - name: news
        label: News
        file: content/pages/news.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
      - name: contact
        label: Contact
        file: content/pages/contact.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
      - name: donate
        label: Donate
        file: content/pages/donate.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
      - name: terms
        label: Terms of use
        file: content/pages/terms.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
      - name: privacy
        label: Privacy
        file: content/pages/privacy.{{locale}}.json
        format: json
        i18n: true
        fields: *page_fields
  - name: events
    label: Events
    i18n: true
    files:
      - name: events
        label: Events
        file: content/events.json
        format: json
        i18n: true
        fields:
          - name: events
            label: Events
            widget: list
            i18n: true
            summary: "{{title}} — {{date}}"
            fields:
              - { name: slug, label: Slug, widget: string, i18n: duplicate }
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: summary, label: Summary, widget: text, i18n: true }
              - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate }
              - { name: time, label: Time, widget: string, i18n: true }
              - { name: location, label: Location, widget: string, i18n: true }
              - { name: image, label: Image, widget: image, i18n: duplicate }
              - { name: imageAlt, label: Image description, widget: string, i18n: true }
  - name: articles
    label: Articles
    i18n: true
    files:
      - name: articles
        label: Articles
        file: content/articles.json
        format: json
        i18n: true
        fields:
          - name: articles
            label: Articles
            widget: list
            i18n: true
            summary: "{{title}} — {{publishedAt}}"
            fields:
              - { name: slug, label: Slug, widget: string, i18n: duplicate }
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: summary, label: Summary, widget: text, i18n: true }
              - { name: publishedAt, label: Published date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate }
              - name: tags
                label: Tags
                widget: list
                i18n: true
                field: { name: tag, label: Tag, widget: string, i18n: true }
              - { name: image, label: Image, widget: image, i18n: duplicate }
              - { name: imageAlt, label: Image description, widget: string, i18n: true }
              - { name: body, label: Article body, widget: markdown, i18n: true }
